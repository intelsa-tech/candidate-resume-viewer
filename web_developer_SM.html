      "Technical assessment will be the key filter: his CV suggests strong WP knowledge that the interview did not fully surface due to communication friction."
    ],
    videoUrl: "https://daily-co-call-recordings.s3.us-west-2.amazonaws.com/vapi/Dc2qp9VhhzOQqpOxRZyK/1780592383875",
    verdictClass: "green-l",
    verdict: "<strong>Recommendation:</strong> Recommended with conditions. Cesar's WordPress profile is credible and his 7 years of government-scale experience — including a full Joomla-to-WordPress migration across hundreds of portals — is directly relevant to this role. Two conditions must be met before advancing to the client interview: (1) English must be re-assessed and confirmed at B2 minimum, and (2) salary expectation must be formally aligned to the client range. If both are resolved, his technical background warrants the SMDigital technical assessment."
  }
];

let currentId = candidates[0].id;

function buildTabs() {
  const nav = document.getElementById('candidateTabs');
  nav.innerHTML = '';
  candidates.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'candidate-tab' + (c.id === currentId ? ' active' : '');
    btn.textContent = c.name;
    btn.dataset.id = c.id;
    btn.addEventListener('click', () => {
      currentId = c.id;
      document.querySelectorAll('.candidate-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(c.id);
    });
    nav.appendChild(btn);
  });
}

function render(id) {
  const c = candidates.find(x => x.id === id);
  if (!c) return;
  const body = document.getElementById('pageBody');

  const tagsHtml = c.tags.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('');

  const profileHtml = c.profileRows.map(([k,v]) =>
    `<tr><td>${k}</td><td>${v}</td></tr>`
  ).join('');

  const barValClass = c.bars[0].green ? ' green-val' : '';
  const barFillClass = c.bars[0].green ? ' gfill' : '';

  const barsHtml = c.bars.map(b => `
    <div class="bar-item">
      <div class="bar-top">
        <span class="bar-name">${b.label}</span>
        <span class="bar-val${barValClass}">${b.val}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill${barFillClass}" style="width:${b.pct}%"></div>
      </div>
    </div>
  `).join('');

  const skillsHtml = c.skills.map(s =>
    `<span class="skill-pill ${c.skillClass}">${s}</span>`
  ).join('');

  const expHtml = c.experience.map(e => `
    <div class="exp-item">
      <div class="exp-title">${e.title}</div>
      <div class="exp-company">${e.company}</div>
      <div class="exp-period">${e.period}</div>
      <ul class="exp-bullets">
        ${e.bullets.map(b => `<li>${b}</li>`).join('')}
      </ul>
    </div>
  `).join('');

  const insightsHtml = c.insights.map(i => `
    <div class="insight-block">
      <div class="insight-title">${i.title}</div>
      <div class="insight-text">${i.text}</div>
    </div>
  `).join('');

  const watchHtml = c.watchItems ? `
    <div class="watch-box">
      <div class="watch-title">Conditions &amp; Points to Probe Before Advancing</div>
      <ul class="watch-list">
        ${c.watchItems.map(w => `<li>${w}</li>`).join('')}
      </ul>
    </div>
  ` : '';

  body.innerHTML = `
    <!-- PROFILE HEADER -->
    <div class="profile-header">
      <div class="profile-strip ${c.strip}"></div>
      <div class="profile-head-inner">
        <div class="avatar-circle ${c.avatarClass}">${c.initials}</div>
        <div class="profile-info">
          <div class="head-name">${c.fullName}</div>
          <div class="head-title">${c.title}</div>
          <div class="head-location">${c.location}</div>
          <div class="tags-row">${tagsHtml}</div>
        </div>
        <div class="profile-right">
          <div class="score-circle ${c.scoreClass}">
            <span class="score-num">${c.scoreVal}</span>
            <span class="score-denom">/ 10</span>
          </div>
          <span class="rec-badge ${c.recClass}">${c.recLabel}</span>
        </div>
      </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="content-grid">

      <!-- Salary & Availability -->
      <div class="salary-box">
        <div class="salary-item">
          <div class="salary-item-label">Salary Expectation</div>
          <div class="salary-item-val">${c.salary.expectation}</div>
          <div class="salary-item-note">${c.salary.note}</div>
        </div>
        <div class="salary-divider"></div>
        <div class="salary-item">
          <div class="salary-item-label">Notice Period</div>
          <div class="salary-item-val">${c.salary.notice}</div>
          <div class="salary-item-note">Available to start shortly after offer acceptance</div>
        </div>
        <div class="salary-divider"></div>
        <div class="salary-item">
          <div class="salary-item-label">Client Salary Range</div>
          <div class="salary-item-val">${c.salary.range}</div>
          <div class="salary-item-note">Contract or Employee (Colombia-based candidates only)</div>
        </div>
      </div>

      <!-- Profile + Scores -->
      <div class="content-card">
        <div class="section-label">Candidate Profile</div>
        <table class="info-table">${profileHtml}</table>
        <hr style="border:none;border-top:1px solid var(--gray-mid);margin:16px 0;">
        <div class="section-label">Interview Scores</div>
        ${barsHtml}
      </div>

      <!-- Insights -->
      <div class="content-card">
        <div class="section-label">Interview Insights</div>
        ${insightsHtml}
      </div>

      <!-- Skills -->
      <div class="content-card full">
        <div class="section-label">Tech Stack & Skills</div>
        <div class="skills-wrap">${skillsHtml}</div>
      </div>

      <!-- Experience -->
      <div class="content-card full">
        <div class="section-label">Work Experience</div>
        ${expHtml}
      </div>

      <!-- Watch box -->
      ${watchHtml}

      <!-- Interview Recording -->
      <div class="content-card full">
        <div class="section-label">Interview Recording</div>
        <div class="video-wrap">
          <video src="${c.videoUrl}" controls preload="auto"></video>
        </div>
      </div>

      <!-- Verdict -->
      <div class="verdict-box ${c.verdictClass}">
        <p>${c.verdict}</p>
      </div>

    </div>
  `;
}

buildTabs();
render(currentId);
</script>
</body>
</html>
